<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>第五届职工篮球赛</title>
<style>
  :root{
    --bg1:#0b1220; --bg2:#111a2e; --bg3:#0e1626;
    --card:rgba(255,255,255,.06);
    --card-brd:rgba(255,255,255,.10);
    --txt:#e8edf6; --txt-dim:#9fb0c8; --txt-mute:#6b7c95;
    --gold:#f59e0b; --gold-soft:rgba(245,158,11,.16);
    --win:#34d399;
    /* theme-aware extras */
    --bg-grad:#1b2b4a;
    --app-shadow:rgba(0,0,0,.5);
    --expand-shadow:rgba(0,0,0,.22);
    --overlay:rgba(0,0,0,.6);
    --overlay-sm:rgba(0,0,0,.15);
    --embed:rgba(0,0,0,.18);
    --embed2:rgba(255,255,255,.08);
    --hover:rgba(255,255,255,.06);
    --press:rgba(255,255,255,.07);
    --chip-brd:rgba(255,255,255,.07);
    --tag-rr-bg:rgba(148,163,184,.18);
    --tag-rr-tx:#cbd5e1;
    --danger:#f87171;
    --danger-bd:rgba(248,113,113,.5);
    --danger-soft:#fca5a5;
    --on-gold:#1a1205;
    --rank-c1:#fde047; --rank-c2:#e2e8f0; --rank-c3:#fdba74;
    --option-bg:#1e293b;
    --toast-bg:rgba(20,30,50,.96);
    --no-shadow:inset 0 1px 0 rgba(255,255,255,.30), inset 0 -2px 4px rgba(0,0,0,.18);
    --star-off:rgba(255,255,255,.22);
    --neutral:#64748b;
    --neutral-soft:rgba(255,255,255,.04);
    --appbar-grad:rgba(245,158,11,.14);
  }
  [data-theme="light"]{
    --bg1:#eef2f8; --bg2:#ffffff; --bg3:#f4f7fb;
    --card:#ffffff;
    --card-brd:rgba(15,23,42,.10);
    --txt:#1a2332; --txt-dim:#475569; --txt-mute:#7a899c;
    --gold:#d97706; --gold-soft:rgba(217,119,6,.12);
    --win:#059669;
    --bg-grad:#dbe4f0;
    --app-shadow:rgba(15,23,42,.12);
    --expand-shadow:rgba(15,23,42,.10);
    --overlay:rgba(15,23,42,.42);
    --overlay-sm:rgba(15,23,42,.05);
    --embed:rgba(15,23,42,.05);
    --embed2:rgba(15,23,42,.07);
    --hover:rgba(15,23,42,.045);
    --press:rgba(15,23,42,.06);
    --chip-brd:rgba(15,23,42,.08);
    --tag-rr-bg:rgba(100,116,139,.16);
    --tag-rr-tx:#475569;
    --danger:#dc2626;
    --danger-bd:rgba(220,38,38,.4);
    --danger-soft:#dc2626;
    --on-gold:#1a1205;
    --rank-c1:#ca8a04; --rank-c2:#64748b; --rank-c3:#ea580c;
    --option-bg:#ffffff;
    --toast-bg:rgba(255,255,255,.97);
    --no-shadow:inset 0 1px 0 rgba(255,255,255,.65), inset 0 -2px 4px rgba(0,0,0,.10);
    --star-off:rgba(15,23,42,.18);
    --neutral:#475569;
    --neutral-soft:rgba(15,23,42,.03);
    --appbar-grad:rgba(217,119,6,.10);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",system-ui,sans-serif;
    background:radial-gradient(1200px 600px at 50% -10%, var(--bg-grad) 0%, var(--bg1) 55%), var(--bg1);
    color:var(--txt); overflow:hidden;
  }
  #app{max-width:540px;margin:0 auto;height:100vh;display:flex;flex-direction:column;
       position:relative;background:linear-gradient(180deg,var(--bg2),var(--bg3));
       box-shadow:0 0 60px var(--app-shadow);}
  /* ---- top bar ---- */
  .topbar{display:flex;align-items:center;gap:10px;padding:12px 14px;
          /* iOS 刘海/状态栏安全区：让标题栏内容避开刘海，背景仍延伸到刘海下 */
          padding-top:calc(12px + constant(safe-area-inset-top));
          padding-top:calc(12px + env(safe-area-inset-top));
          background:linear-gradient(180deg,var(--appbar-grad),transparent);
          border-bottom:1px solid var(--card-brd);flex:0 0 auto;z-index:20;}
  .hamb{width:42px;height:42px;border-radius:12px;border:1px solid var(--card-brd);
        background:var(--card);color:var(--txt);font-size:22px;line-height:1;cursor:pointer;
        display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
  .hamb:active{transform:scale(.94);}
  .titles{display:flex;flex-direction:column;line-height:1.15;min-width:0;}
  .titles .kick{font-size:11px;color:var(--gold);letter-spacing:2px;font-weight:600;}
  .titles .main{font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  /* ---- content ---- */
  #content{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 14px 14px;}
  .app-footer{flex:0 0 auto;text-align:center;font-size:11px;color:var(--txt-mute);
              padding:10px 14px;border-top:1px solid var(--card-brd);background:var(--overlay-sm);letter-spacing:.3px;}
  .page-title{font-size:18px;font-weight:800;margin:2px 2px 14px;display:flex;align-items:center;gap:8px;}
  .page-title .bar{width:4px;height:18px;background:var(--gold);border-radius:3px;}
  .page-sub{font-size:12px;color:var(--txt-mute);font-weight:400;margin-left:auto;}
  /* ---- drawer ---- */
  .scrim{position:absolute;inset:0;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;
         transition:opacity .25s;z-index:40;}
  .scrim.open{opacity:1;pointer-events:auto;}
  .drawer{position:absolute;top:0;left:0;height:100%;width:74%;max-width:300px;
          background:linear-gradient(180deg,var(--bg2),var(--bg3));border-right:1px solid var(--card-brd);
          transform:translateX(-102%);transition:transform .28s ease;z-index:50;display:flex;flex-direction:column;}
  .drawer.open{transform:translateX(0);}
  .drawer-head{padding:22px 18px 14px;border-bottom:1px solid var(--card-brd);}
  .drawer-head .k{font-size:11px;color:var(--gold);letter-spacing:2px;font-weight:700;}
  .drawer-head .t{font-size:15px;font-weight:700;margin-top:4px;}
  .menu{list-style:none;margin:0;padding:8px;flex:1 1 auto;overflow-y:auto;}
  .menu li{display:flex;align-items:center;gap:12px;padding:14px 14px;border-radius:12px;
           font-size:15px;font-weight:600;cursor:pointer;color:var(--txt);}
  .menu li .ico{font-size:18px;width:24px;text-align:center;}
  .menu li.active{background:var(--gold-soft);color:var(--gold);}
  .menu li:active{background:var(--press);}
  .drawer-foot{padding:12px;border-top:1px solid var(--card-brd);}
  .mini-btn{width:100%;padding:11px;border-radius:10px;border:1px solid var(--card-brd);
            background:var(--card);color:var(--txt-dim);font-size:13px;font-weight:600;cursor:pointer;}
  .mini-btn:active{transform:scale(.98);}
  .mini-btn.danger{color:var(--danger-soft);border-color:var(--danger-bd);}
  /* ---- generic cards / sections ---- */
  .section{margin-bottom:18px;}
  .section-h{font-size:13px;color:var(--txt-dim);font-weight:700;margin:6px 4px 10px;
             display:flex;align-items:center;gap:8px;}
  .section-h .dot{width:7px;height:7px;border-radius:50%;background:var(--gold);}
  /* match card (schedule) */
  .match{background:var(--card);border:1px solid var(--card-brd);border-radius:16px;
         padding:10px 10px;margin-bottom:12px;overflow:hidden;}
  .match-row{display:flex;align-items:center;justify-content:space-between;gap:6px;}
  .match-info{flex:0 0 auto;min-width:30px;display:flex;flex-direction:row;align-items:center;gap:4px;flex-wrap:wrap;}
  .m-time{font-size:11px;font-weight:700;color:var(--txt);line-height:1.1;}
  .m-tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;display:inline-block;width:fit-content;line-height:1;}
  .m-tag.rr{background:var(--tag-rr-bg);color:var(--tag-rr-tx);}
  .m-tag.fin{background:var(--gold-soft);color:var(--gold);}
  .match-board{flex:1 1 auto;display:flex;align-items:center;justify-content:center;gap:4px;min-width:0;}
  .sb-team{flex:1 1 0;display:flex;align-items:center;gap:4px;min-width:0;}
  .sb-team.left{justify-content:flex-end;text-align:right;}
  .sb-team.right{justify-content:flex-start;}
  .sb-name{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .sb-chip{width:4px;height:22px;border-radius:3px;flex:0 0 auto;}
  .sb-score{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;min-width:28px;text-align:center;}
  .sb-score.zero{color:var(--txt-mute);}
  .sb-colon{font-size:14px;font-weight:700;color:var(--txt-mute);}
  .sb-team.win .sb-name{color:var(--win);}
  .sb-team.win .sb-score{color:var(--win);}
  .m-data-btn{flex:0 0 auto;font-size:11px;font-weight:700;color:var(--gold);
              background:transparent;border:1px solid rgba(245,158,11,.4);border-radius:20px;
              padding:4px 8px;cursor:pointer;}
  .m-data-btn:active{transform:scale(.95);}
  /* placeholder keeps same width so boards align with/without data button */
  .m-data-ph{flex:0 0 auto;font-size:11px;font-weight:700;color:transparent;
             background:transparent;border:1px solid transparent;border-radius:20px;
             padding:4px 8px;visibility:hidden;user-select:none;}
  /* match data panel */
  .m-panel{margin-top:8px;border-top:1px solid var(--card-brd);padding-top:10px;display:none;}
  .m-panel.show{display:block;}
  .mp-detail{background:var(--embed);border-radius:14px;padding:10px;}
  .mp-heads{display:flex;gap:8px;margin-bottom:10px;}
  .mp-head{flex:1 1 50%;border-radius:10px;padding:8px 10px;display:flex;align-items:center;justify-content:space-between;color:#fff;font-weight:700;font-size:13px;min-width:0;}
  .mp-hname{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .mp-hscore{font-weight:800;font-variant-numeric:tabular-nums;flex:0 0 auto;margin-left:6px;}
  .mp-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .mp-col{display:flex;flex-direction:column;gap:4px;}
  .mp-row{display:flex;align-items:center;gap:6px;font-size:12px;}
  .mp-row.hl{background:var(--gold-soft);border-radius:8px;padding:2px 4px;margin:0 -4px;outline:1px solid var(--gold);}
  .mp-row.hl .mp-name{color:var(--gold);font-weight:800;}
  .mp-no{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;
          font-size:12px;font-weight:800;flex:0 0 auto;font-family:"Arial","Helvetica Neue",sans-serif;
          box-shadow:var(--no-shadow);}
  .mp-name{width:54px;flex:0 0 auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--txt);font-size:13px;letter-spacing:.5px;}
  .mp-bar{flex:1 1 auto;height:8px;background:var(--embed2);border-radius:999px;overflow:hidden;min-width:20px;}
  .mp-bar span{display:block;height:100%;border-radius:999px;transition:width .3s;}
  .mp-sc{width:28px;text-align:right;font-weight:800;font-variant-numeric:tabular-nums;flex:0 0 auto;color:var(--txt);font-size:15px;font-family:"Arial","Helvetica Neue",sans-serif;}
  .mp-empty{text-align:center;color:var(--txt-mute);font-size:12px;padding:10px 0;}
  @media (max-width:380px){
    .mp-name{width:40px;font-size:11px;}
    .mp-no{width:20px;height:20px;font-size:9px;}
  }
  /* cheer scoring */
  .cheer-match{background:var(--card);border:1px solid var(--card-brd);border-radius:16px;padding:12px 14px;margin-bottom:12px;overflow:hidden;}
  .cheer-mh{font-size:13px;font-weight:800;color:var(--txt);margin-bottom:10px;}
  .cheer-team{background:var(--neutral-soft);border-radius:12px;padding:10px 12px;margin:8px 0;border-left:4px solid var(--neutral);}
  .cheer-th{font-size:14px;font-weight:800;margin-bottom:8px;}
  .ch-dim{display:flex;align-items:center;gap:10px;padding:3px 0;}
  .ch-dl{width:38px;flex:0 0 auto;font-size:13px;color:var(--txt);}
  .ch-stars{display:flex;gap:4px;cursor:pointer;}
  .star{font-size:20px;line-height:1;color:var(--star-off);transition:transform .08s,color .1s;user-select:none;}
  .star.on{text-shadow:0 0 6px currentColor;}
  .star:active{transform:scale(1.25);}
  .ch-submit{margin-top:8px;display:block;width:100%;font-size:13px;font-weight:700;
             background:transparent;border:1.5px solid var(--neutral);border-radius:20px;padding:6px 0;cursor:pointer;color:var(--neutral);}
  .ch-submit:active{transform:scale(.98);}
  .cheer-agg{margin-top:8px;font-size:12px;color:var(--txt-mute);}
  .cheer-agg b{color:var(--txt);font-variant-numeric:tabular-nums;}
  .cheer-user-badge{margin:-4px 0 14px;font-size:12px;color:var(--txt-mute);}
  .cheer-user-badge b{color:var(--gold);}
  .cheer-name-card{margin:28px 14px;background:var(--card);border:1px solid var(--card-brd);border-radius:16px;padding:22px 18px;text-align:center;}
  .cheer-nm-t{font-size:15px;font-weight:800;color:var(--txt);margin-bottom:14px;}
  .cheer-nm-input{width:70%;max-width:240px;background:var(--embed2);border:1px solid var(--card-brd);
                  color:var(--txt);border-radius:12px;padding:10px 14px;font-size:15px;text-align:center;outline:none;}
  .cheer-nm-input:focus{border-color:var(--gold);}
  .cheer-nm-btn{margin-top:14px;display:inline-block;}
  .ch-done{margin-top:8px;display:block;width:100%;text-align:center;font-size:13px;font-weight:800;
           border:1.5px solid;border-radius:20px;padding:6px 0;}
  .cheer-next{margin:6px 2px 4px;padding:10px 12px;border-radius:12px;
              background:var(--gold-soft);border:1px dashed var(--gold);
              color:var(--gold);font-size:12px;line-height:1.7;text-align:center;}
  .empty-state{margin:48px 18px;text-align:center;color:var(--txt-mute);font-size:14px;line-height:1.8;}
  /* cheer admin tables */
  .chg-table{width:100%;border-collapse:collapse;font-size:13px;}
  .chg-table th{background:var(--hover);padding:7px 6px;text-align:left;font-weight:700;color:var(--txt-mute);white-space:nowrap;}
  .chg-table td{padding:7px 6px;border-top:1px solid var(--card-brd);font-variant-numeric:tabular-nums;}
  .chg-actions{margin-top:14px;display:flex;justify-content:flex-end;}
  .chg-reset{background:transparent;border:1px solid var(--danger-bd);color:var(--danger);
             font-size:11px;border-radius:12px;padding:3px 9px;cursor:pointer;white-space:nowrap;}
  .chg-reset:active{transform:scale(.95);}
  @media (max-width:380px){
    .ch-dl{width:32px;font-size:12px;}
    .star{font-size:18px;}
  }
  /* daily results */
  .day-card{background:var(--card);border:1px solid var(--card-brd);border-radius:16px;
            padding:12px 14px;margin-bottom:14px;}
  .day-h{font-size:15px;font-weight:800;margin-bottom:10px;display:flex;align-items:center;gap:8px;}
  .day-h .badge{font-size:11px;font-weight:700;color:var(--gold);background:var(--gold-soft);
                padding:2px 9px;border-radius:20px;}
  .day-match{display:flex;align-items:stretch;position:relative;gap:0;padding:0;border-radius:14px;overflow:hidden;min-height:54px;}
  .day-match + .day-match{border-top:1px dashed var(--chip-brd);}
  .dm-team{flex:1 1 50%;display:flex;align-items:center;min-width:0;padding:12px 10px;}
  .dm-team.left{justify-content:flex-start;padding-right:52px;}
  .dm-team.right{justify-content:flex-end;padding-left:52px;text-align:right;}
  .dm-name{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
           color:var(--txt);}
  .dm-center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;align-items:center;gap:4px;z-index:2;}
  .dm-score{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;min-width:30px;text-align:center;}
  .dm-colon{color:var(--txt-mute);font-weight:700;font-size:14px;}
  .dm-w .dm-score{color:var(--win);}
  .day-match-wrap{background:var(--card);border:1px solid var(--card-brd);border-radius:16px;
                  padding:12px 14px;margin-bottom:10px;transition:all .2s;}
  .day-match-wrap.expanded{border-color:rgba(245,158,11,.35);box-shadow:0 8px 24px var(--expand-shadow);}
  .day-match{cursor:pointer;}
  .dm-arrow{width:8px;height:8px;border-right:2px solid var(--txt-mute);border-bottom:2px solid var(--txt-mute);
            position:absolute;right:12px;top:50%;transform:translateY(-50%) rotate(45deg);transition:transform .2s;z-index:3;}
  .day-match-wrap.expanded .dm-arrow{transform:translateY(-50%) rotate(-135deg);}
  .dm-detail{margin-top:12px;}
  .dpp-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .dpp-col{background:var(--embed);border-radius:12px;overflow:hidden;padding:8px 10px;}
  .dpp-body{padding:0;}
  .dpp-row{display:flex;align-items:center;gap:6px;padding:4px 0;font-size:12px;}
  .dpp-no{width:22px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center;
          font-size:10px;font-weight:700;color:#fff;flex:0 0 auto;}
  .dpp-name{width:48px;flex:0 0 auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--txt);}
  .dpp-bar{flex:1 1 auto;height:6px;background:var(--embed2);border-radius:3px;overflow:hidden;min-width:20px;}
  .dpp-bar span{display:block;height:100%;border-radius:3px;transition:width .3s;}
  .dpp-sc{width:24px;text-align:right;font-weight:800;font-variant-numeric:tabular-nums;flex:0 0 auto;color:var(--txt);}
  .dpp-empty{text-align:center;color:var(--txt-mute);font-size:12px;padding:10px 0;}
  @media (max-width:380px){
    .dpp-name{width:40px;font-size:11px;}
    .dpp-no{width:20px;height:20px;font-size:9px;}
  }
  /* rankings */
  .toggle{display:flex;background:var(--card);border:1px solid var(--card-brd);border-radius:12px;
          padding:4px;margin-bottom:14px;}
  .toggle button{flex:1;border:none;background:transparent;color:var(--txt-dim);font-size:14px;
                 font-weight:700;padding:9px;border-radius:9px;cursor:pointer;}
  .toggle button.on{background:var(--gold);color:#1a1205;}
  .toggle button.dim{color:var(--txt-mute);}
  .rk-table{background:var(--card);border:1px solid var(--card-brd);border-radius:16px;overflow:hidden;}
  .rk-row{display:flex;align-items:center;gap:10px;padding:13px 14px;}
  .rk-row + .rk-row{border-top:1px solid var(--chip-brd);}
  .rk-pos{width:30px;font-size:17px;font-weight:800;text-align:center;flex:0 0 auto;}
  .rk-pos.c1{color:var(--rank-c1);} .rk-pos.c2{color:var(--rank-c2);} .rk-pos.c3{color:var(--rank-c3);}
  .rk-name{flex:1 1 auto;font-size:15px;font-weight:700;display:flex;align-items:center;gap:9px;}
  .rk-dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto;}
  .rk-stats{display:flex;gap:14px;font-size:13px;color:var(--txt-dim);}
  .rk-stats b{color:var(--txt);font-size:15px;font-variant-numeric:tabular-nums;}
  .rk-pts{font-size:20px;font-weight:800;color:var(--gold);min-width:38px;text-align:right;}
  .podium{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px;}
  .pod{background:var(--card);border:1px solid var(--card-brd);border-radius:16px;padding:16px 12px;
       text-align:center;}
  .pod .medal{font-size:30px;}
  .pod .lab{font-size:12px;color:var(--txt-mute);margin-top:2px;}
  .pod .pn{font-size:16px;font-weight:800;margin-top:8px;}
  .pod.gold{border-color:var(--gold);background:var(--gold-soft);}
  .note{font-size:12px;color:var(--txt-mute);background:var(--card);border:1px dashed var(--card-brd);
        border-radius:12px;padding:14px;text-align:center;line-height:1.6;}
  /* players */
  .filters{position:sticky;top:-14px;z-index:5;background:var(--bg3);
           padding:14px 14px 10px;margin:0 -14px 12px;}
  .f-row{display:flex;gap:8px;margin-bottom:8px;}
  .f-row select,.f-row input{flex:1;min-width:0;background:var(--card);border:1px solid var(--card-brd);
            color:var(--txt);font-size:14px;padding:11px 10px;border-radius:11px;outline:none;}
  .f-row select option{background:var(--option-bg);color:var(--txt);}
  .f-row input::placeholder{color:var(--txt-mute);}
  .pl-card{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--card-brd);
           border-radius:14px;padding:11px 14px;margin-bottom:10px;cursor:pointer;user-select:none;
           transition:background .12s,border-color .12s,transform .08s;}

<script>
"use strict";
const BASE = window.APP_DATA;
const LS_KEY = "fyns_basketball_v2";
const LS_TS_KEY = "fyns_basketball_ts_v2";     // 当前数据集本地写入时间戳（用于与云端比较新旧）
const SNAP_KEY = "fyns_basketball_snaps_v1";   // 多版本数据快照
const ADMIN_KEY = "fyns2026";             // 管理员导入密钥，可在此修改
let adminVerified = false;              // 当前会话是否已通过管理员密钥（true 后管理操作常驻）
const CHEER_KEY = "fyns_cheer_v1";        // 啦啦队打分（按 日期|场次|队 存数组）
const CHEER_USER_KEY = "fyns_cheer_user_v1"; // 本机评分人姓名（同设备免重复输入）
/* ===== Supabase 云同步配置 =====
   mode:
     "env"    -> 通过 Vercel 服务端环境变量代理（推荐，密钥不出前端）。
                在 Vercel 项目 Settings -> Environment Variables 配置：
                SupabaseURL = https://xxxx.supabase.co
                SupabaseScret = 服务端密钥（Settings -> API -> service_role 或 anon）
                前端请求 /api/cheer（由 app/api/cheer.js 代理到 Supabase）
     "direct" -> 前端直连 Supabase REST（需在此填 url + anon key，密钥会暴露在前端）
     ""       -> 关闭云同步（仅本机 localStorage）
   两种模式都需先在 Supabase 执行建表 SQL（见交付说明）：
   create table if not exists public.cheer_scores(
     id uuid primary key default gen_random_uuid(),
     date text not null, time text not null, team text not null,
     user_name text not null,
     ren int not null default 0, dis int not null default 0, atm int not null default 0,
     ts timestamptz not null default now(), device text
   );
   alter table public.cheer_scores enable row level security;
   create policy "anon read"  on public.cheer_scores for select using (true);
   create policy "anon insert" on public.cheer_scores for insert with check (true);
   create policy "anon delete" on public.cheer_scores for delete using (true); */
const SUPA = {
  mode: "env",  // "env" | "direct" | ""
  url: "",      // direct 模式：例："https://xxxx.supabase.co"
  anon: "",     // direct 模式：例："eyJhbGciOi..."（Settings -> API -> anon public）
};
let DEVICE_ID = "";
try{
  DEVICE_ID = localStorage.getItem("fyns_device_id") ||
    (localStorage.setItem("fyns_device_id","dev-"+Math.random().toString(36).slice(2,10)), localStorage.getItem("fyns_device_id"));
}catch(e){}
let D = Object.assign({}, BASE);          // working data (may be replaced by import)
let imported = false;

// try load imported data
try{
  const raw = localStorage.getItem(LS_KEY);
  if(raw){ const obj = JSON.parse(raw); Object.assign(D, obj); imported = true; }
}catch(e){}

const state = {
  page: "schedule",
  expanded: {},          // seq -> bool (schedule data panel)
  dailyExpanded: {},     // seq -> bool (daily match detail)
  rankingsView: D.meta && D.meta.hasFinal ? "final" : "rr",
  player: { scope:"all", team:"all", name:"" },
  playerList: [],
  playerCount: 0,
  modalPlayer: null,      // {team, number, name} currently opened in player modal
  cheerDraft: {},         // "date|time|team" -> {ren,dis,atm} in-progress ratings
  cheerNow: null,         // 测试用：可覆盖当前时间（ISO 字符串），null 表示用真实时间
};

/* ---------- helpers ---------- */
function hexToRgba(hex,a){
  hex=hex.replace("#","");
  const r=parseInt(hex.substr(0,2),16),g=parseInt(hex.substr(2,2),16),b=parseInt(hex.substr(4,2),16);
  return `rgba(${r},${g},${b},${a})`;
}
function tColor(t){ return (D.teamColors&&D.teamColors[t]) || "#94a3b8"; }
function contrastColor(hex){
  const h = hex.replace("#","");
  const r=parseInt(h.substr(0,2),16), g=parseInt(h.substr(2,2),16), b=parseInt(h.substr(4,2),16);
  const yiq = ((r*299)+(g*587)+(b*114))/1000;
  return yiq>=150 ? "#1f2937" : "#ffffff";
}
function rgbaColor(hex,a){
  const h = hex.replace("#","");
  const r=parseInt(h.substr(0,2),16), g=parseInt(h.substr(2,2),16), b=parseInt(h.substr(4,2),16);
  return `rgba(${r},${g},${b},${a})`;
}
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function teamScore(date,time,team){
  const arr = D.matchPlayers[date+"|"+time+"|"+team];
  if(!arr) return 0;
  return arr.reduce((s,p)=>s+(p.score||0),0);
}
function displayTeams(m){
  if(m.isFinal){
    const actual = Object.keys(D.matchPlayers)
      .filter(k=>k.startsWith(m.date+"|"+m.time+"|"))
      .map(k=>k.split("|")[2]);
    if(actual.length>=2) return actual.slice(0,2);
  }
  return [m.home,m.away];
}
function matchHasData(m){
  return Object.keys(D.matchPlayers).some(k=>k.startsWith(m.date+"|"+m.time+"|"));
}
function matchWinner(m){
  const t = displayTeams(m);
  if(t.length<2) return null;
  const a = teamScore(m.date,m.time,t[0]), b = teamScore(m.date,m.time,t[1]);
  if(a===b) return null;
  return a>b ? t[0] : t[1];
}

/* ---------- toast ---------- */
let toastT;
function toast(msg){
  const el=document.getElementById("toast");
  el.textContent=msg; el.classList.add("show");
  clearTimeout(toastT);
  toastT=setTimeout(()=>el.classList.remove("show"),2200);
}

/* ---------- cheer scoring (啦啦队打分) ---------- */
const CHEER_DIMS = [
  {key:"ren", label:"人数"},
  {key:"dis", label:"纪律"},
  {key:"atm", label:"氛围"},
];
let cheerStore = loadCheer();
let cheerUser = "";                       // 本机评分人姓名
try{ cheerUser = localStorage.getItem(CHEER_USER_KEY) || ""; }catch(e){}
function loadCheer(){
  try{ return JSON.parse(localStorage.getItem(CHEER_KEY)) || {}; }catch(e){ return {}; }
}
function saveCheer(d){ try{ localStorage.setItem(CHEER_KEY, JSON.stringify(d)); }catch(e){} }
function setCheerUser(name){
  cheerUser = (name==null?"":String(name)).trim();
  try{ localStorage.setItem(CHEER_USER_KEY, cheerUser); }catch(e){}
}
function cheerKey(date,time,team){ return date+"|"+time+"|"+team; }
function cheerAgg(date,time,team){
  const arr = cheerStore[cheerKey(date,time,team)] || [];
  const total = arr.reduce((s,r)=>s+(+r.ren)+(+r.dis)+(+r.atm),0);
  return { total, count:arr.length, avg: arr.length? total/arr.length : 0 };
}
function addCheer(date,time,team,rec){
  const k = cheerKey(date,time,team);
  const arr = cheerStore[k] = cheerStore[k] || [];
  const u = rec && rec.user;
  if(u && arr.some(r=>r.user===u)) return false;   // 每设备每场每队仅一次
  const id = (rec && rec.id) || (Date.now()+"-"+Math.random().toString(36).slice(2,8));
  arr.push(Object.assign({id:id, ts:new Date().toISOString()}, rec));
  saveCheer(cheerStore);
  syncCheerToCloud(date, time, team, Object.assign({id:id}, rec));
  return true;
}
function clearCheer(){ cheerStore = {}; saveCheer(cheerStore); }
function resetCheerRecord(id){
  let removed=false;
  Object.keys(cheerStore).forEach(k=>{
    const arr=cheerStore[k];
    const idx=arr.findIndex(r=>r.id===id);
    if(idx>=0){ arr.splice(idx,1); removed=true; if(arr.length===0) delete cheerStore[k]; }
  });
  if(removed){ saveCheer(cheerStore); removeCheerFromCloud(id); }
  return removed;
}
/* ---------- Supabase 云同步（跨设备共享打分） ----------
   env 模式：请求 /api/cheer（Vercel serverless 代理，密钥在服务端环境变量）
   direct 模式：前端直连 Supabase REST（url + anon）
   关闭：以上均为 no-op，仅本机 localStorage */
function supaEnabled(){ return SUPA.mode==="env" || !!(SUPA.url && SUPA.anon); }
function supaHeaders(){ return { apikey:SUPA.anon, Authorization:"Bearer "+SUPA.anon, "Content-Type":"application/json" }; }
async function refreshCheerFromCloud(){
  if(!supaEnabled()) return;
  try{
    let res;
    if(SUPA.mode==="env"){
      res = await fetch("/api/cheer");
    }else{
      res = await fetch(SUPA.url+"/rest/v1/cheer_scores?select=id,date,time,team,user_name,ren,dis,atm,ts&order=ts.asc", { headers: supaHeaders() });
    }
    if(!res.ok) throw new Error("http "+res.status);
    const rows = await res.json();
    const store = {};
    (rows||[]).forEach(r=>{
      const k = cheerKey(r.date, r.time, r.team);
      (store[k] = store[k] || []).push({
        id: r.id, date: r.date, time: r.time, team: r.team,
        user: r.user_name || "", ren: +r.ren || 0, dis: +r.dis || 0, atm: +r.atm || 0,
        ts: r.ts || "" });
    });
    cheerStore = store;
    saveCheer(cheerStore);
    return true;
  }catch(e){ return false; }
}
function syncCheerToCloud(date, time, team, rec){
  if(!supaEnabled()) return;
  try{
    const body = { date:date, time:time, team:team, user_name:rec.user||"", ren:rec.ren||0, dis:rec.dis||0, atm:rec.atm||0, device:DEVICE_ID };
    const p = SUPA.mode==="env"
      ? fetch("/api/cheer", { method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify(body) })
      : fetch(SUPA.url + "/rest/v1/cheer_scores", { method:"POST", headers:Object.assign({Prefer:"return=minimal"}, supaHeaders()), body: JSON.stringify(body) });
    p.then(res=>{ if(!res.ok) throw new Error("sync "+res.status); })
     .catch(()=>{ toast("云同步失败，本条仅本机可见"); });
  }catch(e){}
}
function removeCheerFromCloud(id){

   direct 模式前端直连 Supabase；关闭则为 no-op，仅本机。
   云端以单行为当前数据集（id="active"），各设备启动/定时拉取较新者，导入/恢复时回写。 */
async function loadDatasetFromCloud(){
  if(!supaEnabled() || typeof fetch === "undefined") return null;

    }else{
      res = await fetch(SUPA.url+"/rest/v1/match_dataset?id=eq.active&select=id,data,updated_at,updated_by", { headers: supaHeaders() });
    }
    if(!res.ok) return null;
    const d = await res.json();
    return (d && Array.isArray(d)) ? (d[0]||null) : (d||null);
  }catch(e){ return null; }
}
async function pushDatasetToCloud(){
  if(!supaEnabled() || typeof fetch === "undefined") return false;
  try{
    const data = currentDynamic();

    const p = SUPA.mode==="env"
      ? fetch("/api/dataset", { method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify({ data:data, updated_by:DEVICE_ID }) })
      : fetch(SUPA.url + "/rest/v1/match_dataset", {
          method:"POST",
          headers: Object.assign({ Prefer:"resolution=merge-duplicates,return=minimal" }, supaHeaders()),
          body: JSON.stringify({ id:"active", data:data, updated_at:ts, updated_by:DEVICE_ID })

async function applyCloudDatasetIfNewer(){
  const d = await loadDatasetFromCloud();
  if(!d || !d.data) return false;
  const localTs = localStorage.getItem(LS_TS_KEY);
  const cloudTs = d.updated_at || null;
  // 本地已存在且云端不比本地更新 -> 跳过（避免每次轮询都重渲染）
  if(localTs && cloudTs && new Date(cloudTs) <= new Date(localTs)) return false;
  Object.assign(D, d.data);
  imported = true;
  localStorage.setItem(LS_KEY, JSON.stringify(d.data));

/* 合并云端快照到本机：按 id 取并集（云端新增的快照也出现在本机）；变化时刷新快照列表 */
async function mergeCloudSnaps(){
  if(!supaEnabled() || typeof fetch === "undefined") return false;
  try{
    const remote = await loadSnapsFromCloud();
    if(!remote || !remote.length) return false;
    const local = loadSnaps();
    const map = {};
    local.forEach(s => { map[s.id] = s; });
    let changed = false;
    remote.forEach(s => { if(!map[s.id]){ map[s.id] = s; changed = true; } });
    if(!changed) return false;
    const merged = Object.values(map).sort((a,b)=> new Date(b.time) - new Date(a.time));
    saveSnaps(merged);
    if(document.getElementById("snapModal") && document.getElementById("snapModal").classList.contains("show")) renderSnapList();
    return true;
  }catch(e){ return false; }
}

/* 啦啦队打分可见性：有比赛得分的场次始终展示；无得分场次仅比赛日当天 18:00 后展示 */
function nowDate(){ return state.cheerNow ? new Date(state.cheerNow) : new Date(); }
function todayLabel(){ const d=nowDate(); return `${d.getMonth()+1}月${d.getDate()}日`; }
function nowHour(){ const d=nowDate(); return d.getHours()+d.getMinutes()/60; }
function cheerMatchVisible(m){
  if(matchHasData(m)) return true;                // 已有比分 -> 始终展示打分
  return m.date===todayLabel() && nowHour()>=18;  // 无比分 -> 当日 18:00 后展示
}
/* 下一比赛日预告（打分页底部） */
function parseDateLabel(l){ const m=String(l).match(/(\d+)月(\d+)日/); return m ? [+m[1], +m[2]] : null; }
function nextMatchLabel(){
  const d=nowDate(); const t=d.getMonth()*100+d.getDate()+100; // 用 (月+1)*100+日 比较
  let best=null;
  D.schedule.forEach(m=>{
    const p=parseDateLabel(m.date); if(!p) return;
    const n=p[0]*100+p[1];
    if(n>t && (best===null || n<best[0])) best=[n, m.date];
  });
  return best ? best[1] : null;
}
function cheerNextHtml(){
  const today = todayLabel();
  const isMatchDay = D.schedule.some(m=>m.date===today);
  const next = nextMatchLabel();
  let txt;
  if(!isMatchDay) txt = `今日（${today}）无赛程，啦啦队打分在比赛日「${next||"—"}」18:00 后开放`;
  else txt = `今日（${today}）比赛，啦啦队打分 18:00 后开放`;
  return `<div class="cheer-next">下一比赛打分预告 · ${txt}</div>`;
}

/* ---------- cheer admin: summary / detail / export ---------- */
function cheerTeamRank(){        // 由赛程推算 (日期|场次|队伍) 的排序权重：日期→场次→主队/客队顺序
  const rank={};
  (D.schedule||[]).forEach(m=>{
    const base=(m.seq||0)*10;
    rank[(m.date||"")+"|"+(m.time||"")+"|"+(m.home||"")]=base;
    rank[(m.date||"")+"|"+(m.time||"")+"|"+(m.away||"")]=base+1;
  });
  return rank;
}
function cheerRecords(){          // 打分明细：扁平记录列表，按 日期→场次→队伍(赛程顺序)→提交时间 排序
  const rank=cheerTeamRank();
  const out=[];
  Object.keys(cheerStore||{}).forEach(k=>{
    const p=k.split("|");
    (cheerStore[k]||[]).forEach(r=>{
      out.push({id:r.id||"", date:p[0]||"", time:p[1]||"", team:p[2]||"", user:r.user||"",
        ren:+r.ren||0, dis:+r.dis||0, atm:+r.atm||0, ts:r.ts||"",
        _order: rank[k]===undefined ? 1e9 : rank[k]});
    });
  });
  out.sort((a,b)=> a._order-b._order || (a.ts<b.ts?-1 : a.ts>b.ts?1 : 0));
  return out;
}
function cheerSummary(){          // 汇总：按队聚合 打分人数 + 三维度场均得星 + 综合均分
  const map={};
  cheerRecords().forEach(r=>{
    const o=map[r.team]||(map[r.team]={count:0,ren:0,dis:0,atm:0});
    o.count++; o.ren+=r.ren; o.dis+=r.dis; o.atm+=r.atm;
  });
  return Object.keys(map).map(t=>{
    const o=map[t];
    return {team:t, count:o.count,
      avgRen:o.ren/o.count, avgDis:o.dis/o.count, avgAtm:o.atm/o.count,
      avgTotal:(o.ren+o.dis+o.atm)/(o.count*3)};
  }).sort((a,b)=> b.avgTotal-a.avgTotal || b.count-a.count || a.team.localeCompare(b.team));
}
function summaryRows(){
  return cheerSummary().map(r=>({

    "人数场均得星": +r.avgRen.toFixed(1), "纪律场均得星": +r.avgDis.toFixed(1),
    "氛围场均得星": +r.avgAtm.toFixed(1), "综合均分": +r.avgTotal.toFixed(1)

function exportCSV(filename, rows){
  if(!rows || rows.length===0){ toast("无数据可导出"); return; }
  const headers = Object.keys(rows[0]);
  const lines = [headers.join(",")];
  rows.forEach(r=>{
    lines.push(headers.map(h=>{
      let v = r[h]==null ? "" : String(r[h]);
      if(/[",\n]/.test(v)) v = '"' + v.replace(/"/g,'""') + '"';
      return v;
    }).join(","));
  });
  const csv = "\uFEFF" + lines.join("\r\n");
  try{
    const blob = new Blob([csv], {type:"text/csv;charset=utf-8;"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
    toast("已导出：" + filename);
  }catch(e){ toast("导出失败：" + e.message); }
}

                <span class="sb-name" style="color:${isPH2?'var(--txt-mute)':col2}">${name2}</span>
              </div>
            </div>
            ${hasData ? `<button class="m-data-btn" data-seq="${m.seq}">数据</button>` : `<span class="m-data-ph">数据</span>`}
          </div>
          <div class="m-panel ${open}" id="panel-${m.seq}">${renderMatchPanel(m)}</div>
        </div>`;
    });
    html += `</div>`;
  });
  document.getElementById("content").innerHTML = html;
}

function renderMatchPanel(m, hi){
  const teams = displayTeams(m);
  const res = D.results[m.seq]||{};
  const realKeys = Object.keys(D.matchPlayers).filter(k=>k.startsWith(m.date+"|"+m.time+"|"));
  if(!res.hasData && realKeys.length===0){
    if(m.isFinal) return `<div class="mp-empty">决赛数据尚未导入</div>`;
    return `<div class="mp-empty">本场暂无得分数据</div>`;
  }
  const c1 = tColor(teams[0]), c2 = tColor(teams[1]);
  const total1 = teamScore(m.date,m.time,teams[0]);
  const total2 = teamScore(m.date,m.time,teams[1]);
  function teamBlock(tm,col){
    const arr = D.matchPlayers[m.date+"|"+m.time+"|"+tm] || [];
    const max = Math.max(1, ...arr.map(p=>p.score));
    let rows = arr.length? "" : `<div class="mp-empty">暂无</div>`;
    arr.forEach(p=>{
      const pct = (p.score/max)*100;
      const isHL = hi && hi.team===tm && p.number===hi.number;
      rows += `<div class="mp-row${isHL?' hl':''}">
          <span class="mp-no" style="background:${isHL?col:rgbaColor(col,0.20)};color:${isHL?'#fff':col};border:1px solid ${rgbaColor(col,0.45)}">${p.number}</span>
          <span class="mp-name">${esc(p.name)}</span>
          <div class="mp-bar"><span style="width:${pct}%;background:linear-gradient(90deg, ${rgbaColor(col,0.55)}, ${col});box-shadow:0 0 8px ${col}"></span></div>
          <span class="mp-sc">${p.score}</span>
        </div>`;
    });
    return `<div class="mp-col">${rows}</div>`;
  }
  return `<div class="mp-detail">
      <div class="mp-heads">
        <div class="mp-head" style="background:linear-gradient(135deg, ${rgbaColor(c1,0.85)}, ${c1})"><span class="mp-hname">${esc(teams[0])}</span><span class="mp-hscore">${total1} 分</span></div>
        <div class="mp-head" style="background:linear-gradient(135deg, ${rgbaColor(c2,0.85)}, ${c2})"><span class="mp-hname">${esc(teams[1])}</span><span class="mp-hscore">${total2} 分</span></div>
      </div>
      <div class="mp-grid">${teamBlock(teams[0],c1)}${teamBlock(teams[1],c2)}</div>
    </div>`;
}

/* ---------- render: daily ---------- */
function renderDailyMatchDetail(m){
  const teams = displayTeams(m);
  const c1 = tColor(teams[0]), c2 = tColor(teams[1]);
  const s1 = teamScore(m.date,m.time,teams[0]);
  const s2 = teamScore(m.date,m.time,teams[1]);
  const winTeam = matchWinner(m);

  function teamBlock(tm, col, sc, isWin){
    const arr = D.matchPlayers[`${m.date}|${m.time}|${tm}`] || [];
    const max = Math.max(1, ...arr.map(p=>p.score));
    const total = arr.reduce((a,p)=>a+p.score,0);
    let rows = arr.length ? "" : `<div class="dpp-empty">暂无</div>`;
    arr.forEach(p=>{
      const pct = (p.score/max)*100;
      rows += `<div class="dpp-row">
          <span class="dpp-no" style="background:${col}">${p.number}</span>
          <span class="dpp-name">${esc(p.name)}</span>
          <div class="dpp-bar"><span style="width:${pct}%;background:${col}"></span></div>
          <span class="dpp-sc">${p.score}</span>
        </div>`;
    });
    return `<div class="dpp-col">
        <div class="dpp-body">${rows}</div>
      </div>`;
  }

  return `<div class="dm-detail">
      <div class="dpp-grid">${teamBlock(teams[0],c1,s1,winTeam===teams[0])}${teamBlock(teams[1],c2,s2,winTeam===teams[1])}</div>
    </div>`;
}

function renderDaily(){
  const dates = [...new Set(D.schedule.map(m=>m.date))].reverse();
  let html = `<div class="page-title"><span class="bar"></span>每日战况
     <span class="page-sub">各比赛日对阵得分</span></div>`;
  let any=false;

  // default expand latest match with data if none selected
  const allWithData = [];
  dates.forEach(date=>{
    allWithData.push(...D.schedule.filter(m=>m.date===date && matchHasData(m)));
  });
  if(allWithData.length && Object.keys(state.dailyExpanded).length===0){
    state.dailyExpanded[allWithData[allWithData.length-1].seq] = true;
  }

  dates.forEach(date=>{
    const ms = D.schedule.filter(m=>m.date===date);
    const withData = ms.filter(m=>matchHasData(m));
    if(!withData.length) return;
    any=true;
    html += `<div class="day-card"><div class="day-h">${esc(date)}
        <span class="badge">${withData.length} 场</span></div>`;
    withData.forEach(m=>{
      const teams = displayTeams(m);
      const hasData = matchHasData(m);
      const winTeam = matchWinner(m);
      const isPH = m.isFinal && !hasData;
      const t1 = isPH?"待定":teams[0], t2 = isPH?"待定":teams[1];
      const s1 = isPH?"—":teamScore(m.date,m.time,teams[0]);
      const s2 = isPH?"—":teamScore(m.date,m.time,teams[1]);
      const w1 = !isPH && winTeam===teams[0];
      const w2 = !isPH && winTeam===teams[1];
      const c1 = isPH?"#64748b":tColor(teams[0]);
      const c2 = isPH?"#64748b":tColor(teams[1]);
      const expanded = !!state.dailyExpanded[m.seq];
      const detail = expanded ? renderDailyMatchDetail(m) : "";
      html += `<div class="day-match-wrap ${expanded?'expanded':''}" data-seq="${m.seq}">
          <div class="day-match">
            <div class="dm-team left ${w1?'dm-w':''}" style="background:${rgbaColor(c1,0.18)};">
              <span class="dm-name" style="color:${c1};">${esc(t1)}</span>
            </div>
            <div class="dm-center">
              <span class="dm-score" style="color:${c1};">${s1}</span>
              <span class="dm-colon">:</span>
              <span class="dm-score" style="color:${c2};">${s2}</span>
            </div>
            <div class="dm-team right ${w2?'dm-w':''}" style="background:${rgbaColor(c2,0.18)};">
              <span class="dm-name" style="color:${c2};">${esc(t2)}</span>
            </div>
            <span class="dm-arrow"></span>
          </div>
          ${detail}
        </div>`;
    });
    html += `</div>`;
  });
  if(!any) html += `<div class="empty">暂无比赛得分数据</div>`;
  document.getElementById("content").innerHTML = html;
}

/* ---------- render: rankings ---------- */
function renderRankings(){
  const hasFinal = !!(D.final);
  let toggle = `<div class="toggle">
      <button data-v="rr" class="${state.rankingsView==='rr'?'on':''}">循环赛</button>
      <button data-v="final" class="${state.rankingsView==='final'?'on':''}${hasFinal?'':' dim'}" ${hasFinal?'':'title="决赛数据尚未导入"'}>决赛</button>
    </div>`;
  let html = `<div class="page-title"><span class="bar"></span>阶段排名
     <span class="page-sub">${hasFinal?'已导入决赛数据':'当前为循环赛'}</span></div>${toggle}`;

  if(state.rankingsView==="final"){
    if(!hasFinal){
      html += `<div class="note">决赛数据尚未产生。<br>8月30日 决赛后，将在此展示冠、亚、季、第四名最终名次。</div>`;
    }else{
      const f=D.final;
      html += `<div class="podium">
          <div class="pod gold"><div class="medal">&#127942;</div><div class="lab">冠军</div>
             <div class="pn" style="color:${tColor(f.champion)}">${esc(f.champion||'—')}</div></div>
          <div class="pod"><div class="medal">&#129944;</div><div class="lab">亚军</div>
             <div class="pn" style="color:${tColor(f.runner)}">${esc(f.runner||'—')}</div></div>
          <div class="pod"><div class="medal">&#129945;</div><div class="lab">季军</div>
             <div class="pn" style="color:${tColor(f.third)}">${esc(f.third||'—')}</div></div>
          <div class="pod"><div class="medal">&#10022;</div><div class="lab">第四名</div>
             <div class="pn" style="color:${tColor(f.fourth)}">${esc(f.fourth||'—')}</div></div>
        </div>`;
      // remaining teams by round robin
      const top4 = new Set([f.champion,f.runner,f.third,f.fourth].filter(Boolean));
      const rest = D.rrStandings.filter(s=>!top4.has(s.team));
      if(rest.length){
        html += `<div class="section-h"><span class="dot"></span>其余名次（按循环赛）</div><div class="rk-table">`;
        rest.forEach((s,i)=>{
          html += rkRow(i+5, s);
        });
        html += `</div>`;
      }
    }
  }else{
    html += `<div class="rk-table">`;
    D.rrStandings.forEach((s,i)=>{ html += rkRow(i+1, s); });
    html += `</div>
      <div class="note" style="margin-top:12px;">每胜一场积 2 分，负一场积 1 分；积分相等按相互间胜负排名。</div>`;
  }
  document.getElementById("content").innerHTML = html;
}
function rkRow(pos, s){
  const col=tColor(s.team);
  const cls = pos<=3?`c${pos}`:"";
  return `<div class="rk-row">
      <span class="rk-pos ${cls}">${pos}</span>
      <span class="rk-name"><span class="rk-dot" style="background:${col}"></span>${esc(s.team)}</span>
      <span class="rk-stats"><span>胜 <b>${s.win}</b></span><span>负 <b>${s.loss}</b></span></span>
      <span class="rk-pts">${s.points}</span>
    </div>`;
}

/* ---------- render: players ---------- */
const PAGE_SIZE = 15;
function computePlayerList(){
  const sc = state.player.scope;
  let list = D.players.map(p=>({
    name:p.name, number:p.number, team:p.team,
    score: sc==="rr"?p.rr : sc==="final"?p.final : p.total
  }));
  if(state.player.team!=="all") list = list.filter(p=>p.team===state.player.team);
  if(state.player.name.trim()){
    const q=state.player.name.trim();
    list = list.filter(p=>p.name.includes(q));
  }
  list.sort((a,b)=> b.score-a.score || a.team.localeCompare(b.team) || a.number-b.number);
  return list;
}
function renderPlayersPage(){
  const teams = D.teamOrder || (D.teams||[]).map(t=>t.name);
  let opts = `<option value="all">全部球队</option>` + teams.map(t=>`<option value="${esc(t)}" ${state.player.team===t?'selected':''}>${esc(t)}</option>`).join("");
  const html = `<div class="page-title"><span class="bar"></span>球员得分榜
     <span class="page-sub" id="plTotal"></span></div>
     <div class="filters">
       <div class="f-row">
         <select id="fScope">
           <option value="all" ${state.player.scope==='all'?'selected':''}>全部</option>
           <option value="rr" ${state.player.scope==='rr'?'selected':''}>循环赛</option>
           <option value="final" ${state.player.scope==='final'?'selected':''}>决赛</option>
         </select>
         <select id="fTeam">${opts}</select>
       </div>
       <div class="f-row">
         <input id="fName" type="text" placeholder="搜索球员姓名" value="${esc(state.player.name)}" />
       </div>
     </div>
     <div id="plList"></div>
     <div class="loadtip" id="loadtip"></div>`;
  document.getElementById("content").innerHTML = html;
  renderPlayerList();
}
function renderPlayerList(){
  const list = computePlayerList();
  state.playerList = list;
  const total = list.length;
  const show = list.slice(0, state.playerCount + PAGE_SIZE);
  state.playerCount = show.length;
  const totalEl = document.getElementById("plTotal");
  if(totalEl) totalEl.textContent = `含未得分球员 · 共 ${total} 人`;
  const listEl = document.getElementById("plList");
  if(show.length===0){
    listEl.innerHTML = `<div class="empty">没有符合条件的球员</div>`;
  }else{
    listEl.innerHTML = show.map((p,i)=>{
      const col=tColor(p.team);
      const rank = i+1;
      return `<div class="pl-card" data-team="${esc(p.team)}" data-number="${p.number}" data-name="${esc(p.name)}">
          <span class="pl-rank ${rank<=3?'top':''}">${rank}</span>
          <span class="pl-no">#${p.number}</span>
          <div class="pl-info">
            <div class="pl-name">${esc(p.name)}</div>
            <div class="pl-team" style="color:${col}">${esc(p.team)}</div>
          </div>
          <span class="pl-score ${p.score===0?'zero':''}">${p.score}</span>
        </div>`;
    }).join("");
  }
  const tip=document.getElementById("loadtip");
  if(state.playerCount < total) tip.textContent="上划加载更多…";
  else if(total>0) tip.textContent=`已显示全部 ${total} 名球员`;
}

/* ---------- player detail modal ---------- */
function getPlayerMatches(team, number){
  const out=[];
  D.schedule.forEach(m=>{
    if(m.home!==team && m.away!==team) return;
    if(!matchHasData(m)) return;
    const isHome = m.home===team;
    const opponent = isHome?m.away:m.home;
    const arr = D.matchPlayers[`${m.date}|${m.time}|${team}`]||[];
    const p = arr.find(x=>x.number===number);
    const tScore = teamScore(m.date,m.time,team);
    const oScore = teamScore(m.date,m.time,opponent);
    out.push({
      date:m.date, time:m.time, seq:m.seq, isFinal:m.isFinal,
      opponent, teamScore:tScore, oppScore:oScore,
      playerScore:p?p.score:0, isWin:tScore>oScore
    });
  });
  return out;
}
function openPlayerModal(team, number, name){
  const modal = document.getElementById("playerModal");
  state.modalPlayer = {team, number, name};
  const matches = getPlayerMatches(team, number);
  document.getElementById("modalName").textContent = esc(name);
  document.getElementById("modalMeta").textContent = `${esc(team)} · #${number} · 共 ${matches.length} 场`;
  const body = document.getElementById("modalBody");
  if(matches.length===0){
    body.innerHTML = `<div class="empty">该球员暂无得分数据</div>`;
  }else{
    body.innerHTML = `<div class="pm-list">`+ matches.map(m=>`
      <div class="pm-item" data-seq="${m.seq}">
        <div class="pm-row">
          <span class="pm-tag ${m.isFinal?'fin':''}">${m.isFinal?(m.seq===12?'决赛':'三四名'):'循环赛'}</span>
          <span class="pm-vs">${esc(m.date)} ${esc(m.time)} vs ${esc(m.opponent)}</span>
          <span class="pm-score ${m.playerScore===0?'zero':''}">${m.playerScore} 分</span>
        </div>
        <div class="pm-detail" id="pmd-${m.seq}"></div>
      </div>`).join("")+`</div>`;
  }
  modal.classList.add("show");
}
function closePlayerModal(){
  document.getElementById("playerModal").classList.remove("show");
}

/* ---------- page switch ---------- */
function setPage(p){
  state.page = p;
  state.expanded = {};
  document.querySelectorAll("#menu li").forEach(li=>li.classList.toggle("active", li.dataset.page===p));
  if(p==="schedule") renderSchedule();
  else if(p==="daily"){ state.dailyExpanded={}; renderDaily(); }
  else if(p==="rankings") renderRankings();
  else if(p==="players"){ state.playerCount=0; renderPlayersPage(); }
  else if(p==="cheer"){ renderCheer(); }
  const c=document.getElementById("content");
  c.scrollTop=0;
}

// schedule data button & player modal (delegated)
document.getElementById("content").addEventListener("click", e=>{
  const btn=e.target.closest(".m-data-btn");
  if(btn){
    const seq=+btn.dataset.seq;
    state.expanded[seq]=!state.expanded[seq];
    const panel=document.getElementById("panel-"+seq);
    const m=D.schedule.find(x=>x.seq===seq);
    panel.innerHTML = renderMatchPanel(m);
    panel.classList.toggle("show", state.expanded[seq]);
    return;
  }
  const tg=e.target.closest(".toggle button");
  if(tg){ state.rankingsView=tg.dataset.v; renderRankings(); return; }
  const card=e.target.closest(".pl-card");
  if(card){
    openPlayerModal(card.dataset.team, +card.dataset.number, card.dataset.name);
    return;
  }
  const dm=e.target.closest(".day-match-wrap");
  if(dm){
    const seq=+dm.dataset.seq;
    state.dailyExpanded[seq]=!state.dailyExpanded[seq];
    renderDaily();
    return;
  }
  // cheer scoring: star click
  const star=e.target.closest(".star");
  if(star){
    const key=star.dataset.key, dim=star.dataset.dim, val=+star.dataset.val;
    const d=state.cheerDraft[key]||(state.cheerDraft[key]={ren:0,dis:0,atm:0});
    d[dim]=val;
    const row=star.parentElement;
    const col=row.dataset.col || "#fbbf24";
    row.querySelectorAll(".star").forEach((s,i)=>{
      const on=(i+1)<=val;
      s.classList.toggle("on", on);
      s.style.color = on ? col : "";
    });
    return;
  }
  // cheer scoring: submit
  const sub=e.target.closest(".ch-submit");
  if(sub){
    const key=sub.dataset.key, date=sub.dataset.date, time=sub.dataset.time, team=sub.dataset.team;
    if(!cheerUser){ toast("请先输入评分人姓名"); return; }
    const d=state.cheerDraft[key];
    if(!d || !d.ren || !d.dis || !d.atm){ toast("请完成人数 / 纪律 / 氛围三项评分"); return; }
    const ok = addCheer(date,time,team,{ren:d.ren,dis:d.dis,atm:d.atm,user:cheerUser});
    if(!ok){ toast("本设备已为该队打过分，不可重复提交"); return; }
    delete state.cheerDraft[key];
    renderCheer();
    toast(esc(team)+" 打分已提交");
    return;
  }
});

// infinite scroll on content
let loadingMore=false;
document.getElementById("content").addEventListener("scroll", ()=>{
  if(state.page!=="players") return;
  const c=document.getElementById("content");
  if(c.scrollTop + c.clientHeight >= c.scrollHeight - 60){
    loadMorePlayers();
  }
});
// touch swipe-up to load more
let touchStartY=0;
document.getElementById("content").addEventListener("touchstart", e=>{ touchStartY=e.touches[0].clientY; }, {passive:true});
document.getElementById("content").addEventListener("touchend", e=>{
  if(state.page!=="players") return;
  const c=document.getElementById("content");
  const moved = touchStartY - e.changedTouches[0].clientY;
  if(moved>40 && c.scrollTop + c.clientHeight >= c.scrollHeight - 120){
    loadMorePlayers();
  }
});
function loadMorePlayers(){
  if(loadingMore) return;
  if(state.playerCount >= state.playerList.length) return;
  loadingMore=true;
  // append next page
  const list=state.playerList;
  const next = list.slice(state.playerCount, state.playerCount+PAGE_SIZE);
  state.playerCount += next.length;
  const listEl=document.getElementById("plList");
  const frag = next.map((p,i)=>{
    const col=tColor(p.team); const rank=state.playerCount-next.length+i+1;
    return `<div class="pl-card" data-team="${esc(p.team)}" data-number="${p.number}" data-name="${esc(p.name)}">
        <span class="pl-rank ${rank<=3?'top':''}">${rank}</span>
        <span class="pl-no">#${p.number}</span>
        <div class="pl-info"><div class="pl-name">${esc(p.name)}</div>
          <div class="pl-team" style="color:${col}">${esc(p.team)}</div></div>
        <span class="pl-score ${p.score===0?'zero':''}">${p.score}</span></div>`;
  }).join("");
  listEl.insertAdjacentHTML("beforeend", frag);
  const tip=document.getElementById("loadtip");
  if(state.playerCount>=state.playerList.length){
    if(tip) tip.textContent = `已显示全部 ${state.playerList.length} 名球员`;
  }
  setTimeout(()=>loadingMore=false,120);
}

/* 打分明细弹窗内"重置"（委托，每场每队某人的单条打分） */
document.getElementById("cheerModalBody").addEventListener("click", e=>{
  const btn=e.target.closest(".chg-reset");
  if(!btn) return;
  if(!confirm("确定重置该条打分吗？该评分人将可重新打分。")) return;
  const ok = resetCheerRecord(btn.dataset.id);
  toast(ok ? "已重置该条打分" : "记录不存在");
  openCheerDetailModal();       // 重新渲染明细
  if(state.page==="cheer") renderCheer();  // 同步刷新打分页（恢复该队可打分状态）
});
document.getElementById("fileInput").addEventListener("change", e=>{
  const file=e.target.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload = ev=>{
    try{
      const wb = XLSX.read(ev.target.result, {type:"array"});
      const parsed = parseWorkbook(wb);
      if(!parsed || parsed.dailySheets.length===0) throw new Error("未识别到每日对战信息表（请确认 sheet 名为比赛日期）");
      // merge: keep previously imported days, overwrite (whole match) for days in this file
      const existing = matchPlayersArrToObj(D.matchPlayers || {});
      const merged = Object.assign({}, existing);
      Object.keys(parsed.matchPlayer).forEach(mk=>{ merged[mk] = parsed.matchPlayer[mk]; });
      const dyn = rebuildFromMatchPlayer(merged, parsed.dailySheets);
      Object.assign(D, dyn);
      imported=true;
      localStorage.setItem(LS_KEY, JSON.stringify(dyn));
      localStorage.setItem(LS_TS_KEY, new Date().toISOString());
      if(D.meta) D.meta.hasFinal = !!dyn.final;
      state.rankingsView = dyn.final ? "final" : "rr";
      setPage(state.page==="players"?"players":state.page);
      pushDatasetToCloud();   // 同步到云端，部署网址的其他设备也能看到
      toast("导入成功：" + parsed.dailySheets.join("、") + (dyn.final?"（含决赛数据）":""));
    }catch(err){
      toast("导入失败：" + err.message);
      console.error(err);
    }
    e.target.value="";
  };
  reader.readAsArrayBuffer(file);
});

/* ---------- 管理员：实时录入当日得分 ---------- */
/* 交互状态：当前选中的 日期/场次/队伍 与可编辑的行（每行 号码+得分） */
const liveScore = { date:"", time:"", team:"", mk:"", rows:[] };
/* 由花名册解析号码对应的真实姓名（与 EXCEL 导入一致，缺失显示"球员#N"） */
function rosterName(team, no){
  const p = (BASE.players||[]).find(x=>x.team===team && x.number===(+no));
  return p ? p.name : ("球员#"+no);
}
function lsPopulateDates(){
  const sel = document.getElementById("lsDate");
  const dates = [];
  D.schedule.forEach(m=>{ if(!dates.includes(m.date)) dates.push(m.date); });
  sel.innerHTML = dates.map(d=>`<option value="${esc(d)}">${esc(d)}</option>`).join("");
}
function lsOnDateChange(){
  const date = document.getElementById("lsDate").value;
  liveScore.date = date;
  const sel = document.getElementById("lsTime");
  const times = [];
  D.schedule.forEach(m=>{ if(m.date===date && !times.includes(m.time)) times.push(m.time); });
  sel.innerHTML = times.map(t=>`<option value="${esc(t)}">${esc(t)}</option>`).join("");
  lsOnTimeChange();
}
function lsOnTimeChange(){
  const date = document.getElementById("lsDate").value;
  const time = document.getElementById("lsTime").value;
  liveScore.date = date; liveScore.time = time;
  const sel = document.getElementById("lsTeam");
  const teams = [];
  D.schedule.forEach(m=>{ if(m.date===date && m.time===time){ if(!teams.includes(m.home)) teams.push(m.home); if(!teams.includes(m.away)) teams.push(m.away); } });
  sel.innerHTML = teams.map(t=>`<option value="${esc(t)}">${esc(t)}</option>`).join("");
  lsOnTeamChange();
}
function lsOnTeamChange(){
  const team = document.getElementById("lsTeam").value;
  liveScore.team = team;
  liveScore.mk = liveScore.date+"|"+liveScore.time+"|"+team;
  const arr = D.matchPlayers[liveScore.mk] || [];
  liveScore.rows = arr.map(p=>({number:p.number, score:p.score||0, name:p.name}));
  const meta = document.getElementById("liveScoreMeta");
  if(meta) meta.textContent = `${liveScore.date} ${liveScore.time} · ${team}（共 ${liveScore.rows.length} 人）`;
  lsRenderRows();
}
function lsRenderRows(){
  const box = document.getElementById("lsTable");
  if(!box) return;
  if(liveScore.rows.length===0){
    box.innerHTML = `<div class="ls-empty">本队暂无录入记录，点击"添加一行"开始录入</div>`;
    return;
  }
  box.innerHTML = liveScore.rows.map((r,i)=>`
    <div class="ls-line">
      <input class="ls-no" type="number" min="0" inputmode="numeric" data-i="${i}" value="${r.number==null?'':r.number}" placeholder="号码">
      <div class="ls-name" id="lsnm-${i}">${esc(rosterName(liveScore.team, r.number))}</div>
      <input class="ls-sc" type="number" min="0" inputmode="numeric" data-i="${i}" value="${r.score==null?'':r.score}" placeholder="得分">
      <button class="ls-del" data-i="${i}" title="删除该行">&times;</button>
    </div>`).join("");
}
function lsAddRow(){
  liveScore.rows.push({number:"", score:"", name:""});
  lsRenderRows();
}
function lsCommit(){
  const obj = {};
  liveScore.rows.forEach(r=>{
    const no = parseInt(r.number);
    const sc = parseInt(r.score)||0;
    if(isNaN(no)) return;
    obj[no] = (obj[no]||0) + (isNaN(sc)?0:sc);
  });
  const all = matchPlayersArrToObj(D.matchPlayers);   // 保留其他队伍
  all[liveScore.mk] = obj;                            // 仅覆盖当前队
  const dates = [...new Set(Object.keys(all).map(k=>k.split("|")[0]))];
  const dyn = rebuildFromMatchPlayer(all, dates);
  Object.assign(D, dyn);
  imported = true;
  try{ localStorage.setItem(LS_KEY, JSON.stringify(dyn)); localStorage.setItem(LS_TS_KEY, new Date().toISOString()); }catch(e){}
  if(D.meta) D.meta.hasFinal = !!dyn.final;
  return dyn;
}
async function lsSave(){
  if(!liveScore.team){ toast("请先选择队伍"); return; }
  lsCommit();
  closeLiveScore();
  try{ await pushDatasetToCloud(); }catch(e){}
  setPage(state.page);
  toast("已保存并更新赛程 / 排名 / 球员榜");
}

/* ---------- data snapshots (multi-version, with timestamp) ---------- */
function currentDynamic(){
  return {
    results: D.results, rrStandings: D.rrStandings, final: D.final,
    players: D.players, matchPlayers: D.matchPlayers,
    dailySheets: D.dailySheets, meta: D.meta
  };
}
function loadSnaps(){
  try{ const raw=localStorage.getItem(SNAP_KEY); return raw?JSON.parse(raw):[]; }catch(e){ return []; }
}
function saveSnaps(arr){ localStorage.setItem(SNAP_KEY, JSON.stringify(arr)); }
function fmtTime(iso){
  const d=new Date(iso), p=n=>String(n).padStart(2,"0");
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function saveSnap(){
  const snaps=loadSnaps();
  const now=new Date();
  const id=String(now.getTime());
  snaps.unshift({ id, time:now.toISOString(), data:currentDynamic() });
  saveSnaps(snaps);
  pushSnapToCloud({ id, time:now.toISOString(), data:currentDynamic() });   // 同步云端，跨设备可见
  toast("已保存快照：" + fmtTime(now.toISOString()));
  return id;
}
function renderSnapList(){
  const snaps=loadSnaps();
  const box=document.getElementById("snapList");
  if(snaps.length===0){ box.innerHTML=`<div class="snap-empty">暂无快照，点击"保存快照"创建</div>`; return; }
  box.innerHTML = snaps.map(s=>{
    const ds=(s.data.dailySheets||[]);
    const sub = ds.length ? "含："+ds.join("、") : "初始数据";
    return `<div class="snap-item">
        <div class="snap-info">
          <div class="snap-time">${fmtTime(s.time)}</div>
          <div class="snap-sub">${esc(sub)}</div>
        </div>
        <div class="snap-acts">
          <button class="snap-restore" data-id="${s.id}">恢复</button>
          <button class="snap-del" data-id="${s.id}">删除</button>
        </div>
      </div>`;
  }).join("");
  box.querySelectorAll(".snap-restore").forEach(b=>b.addEventListener("click",()=>{
    if(confirm("确定恢复到该快照吗？当前未单独保存的数据将被覆盖。")) restoreSnap(b.dataset.id);
  }));
  box.querySelectorAll(".snap-del").forEach(b=>b.addEventListener("click",()=>deleteSnap(b.dataset.id)));
}
function openSnapModal(){ renderSnapList(); document.getElementById("snapModal").classList.add("show"); }
function closeSnapModal(){ document.getElementById("snapModal").classList.remove("show"); }
function restoreSnap(id){
  const s=loadSnaps().find(x=>x.id===id);
  if(!s){ toast("快照不存在"); return; }
  Object.assign(D, s.data);
  localStorage.setItem(LS_KEY, JSON.stringify(s.data));
  localStorage.setItem(LS_TS_KEY, new Date().toISOString());
  imported=true;
  state.rankingsView = (s.data.meta && s.data.meta.hasFinal) ? "final" : "rr";
  pushDatasetToCloud();   // 恢复后也同步云端，保持各设备一致
  closeSnapModal();
  closeDrawer();
  setPage(state.page);
  toast("已恢复快照：" + fmtTime(s.time));
}
function deleteSnap(id){
  saveSnaps(loadSnaps().filter(x=>x.id!==id));
  deleteSnapFromCloud(id);   // 同步删除云端，跨设备一致
  renderSnapList();
  toast("已删除快照");
}
document.getElementById("snapSaveBtn").addEventListener("click", ()=>{ closeDrawer(); saveSnap(); });
document.getElementById("snapOpenBtn").addEventListener("click", ()=>{
  closeDrawer();

  openSnapModal();
});

/* recompute dynamic data from a daily workbook (mirrors build_data.py) */
function recompute(wb){
  const teamOrder = BASE.teamOrder;
  const schedule = BASE.schedule;
  const roster = (BASE.players||[]).map(p=>({team:p.team,number:p.number,name:p.name}));
  const ALIAS={};
  teamOrder.forEach(t=>{ ALIAS[t]=t; if(t.endsWith("战队"))ALIAS[t.slice(0,-2)]=t; if(t.endsWith("队"))ALIAS[t.slice(0,-1)]=t; });
  function normTeam(n){ if(n==null)return null; n=String(n).trim(); if(ALIAS[n])return ALIAS[n];
    for(const t of teamOrder){ if(n.includes(t)||t.includes(n)) return t; } return n; }
  function sheetLabel(name){
    name=String(name).trim();
    if(name.includes("月")&&name.includes("日")) return name;
    for(const sep of [".","/","-"]){ if(name.includes(sep)){ const p=name.split(sep);
      if(p.length===2 && /^\d+$/.test(p[0]) && /^\d+$/.test(p[1])) return `${+p[0]}月${+p[1]}日`; } }
    return name;
  }
  const schedByDate={}; schedule.forEach(m=>{ (schedByDate[m.date]=schedByDate[m.date]||[]).push(m); });
  const matchPlayer={};          // "date|time|team" -> {number:score}
  const playerAll={}, playerRR={}, playerFinal={};
  const dailySheets=[];
  wb.SheetNames.forEach(sname=>{
    const ws=wb.Sheets[sname];
    const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:null,raw:true});
    let hIdx=-1;
    for(let i=0;i<rows.length;i++){ if(rows[i]&&rows[i].some(c=>typeof c==="string"&&c.includes("场次"))){hIdx=i;break;} }
    if(hIdx<0) return;
    const header=rows[hIdx];
    const ciField=header.findIndex(h=>h==="场次");
    const ciTeam=header.findIndex(h=>h==="队名");
    const ciNo=header.findIndex(h=>typeof h==="string"&&h.includes("队内号码"));
    const ciScore=header.findIndex(h=>h==="得分");
    if(ciField<0||ciTeam<0||ciNo<0||ciScore<0) return;
    const dateLabel=sheetLabel(sname); dailySheets.push(dateLabel);
    for(let i=hIdx+1;i<rows.length;i++){
      const r=rows[i]; if(!r||r[ciField]==null) continue;
      const ftime=String(r[ciField]).trim();
      const team=normTeam(r[ciTeam]);
      let no, sc;
      try{ no=parseInt(r[ciNo]); sc=r[ciScore]==null?0:parseInt(r[ciScore]); }catch(e){ continue; }
      if(isNaN(no)) continue;
      let seq=null;
      (schedByDate[dateLabel]||[]).forEach(m=>{ if(m.time===ftime) seq=m.seq; });
      const isFinal = (seq!=null && seq>=11);
      const mk=`${dateLabel}|${ftime}|${team}`;
      const mp=matchPlayer[mk]||(matchPlayer[mk]={});
      mp[no]=(mp[no]||0)+ (isNaN(sc)?0:sc);
      const pk=`${team}|${no}`;
      playerAll[pk]=(playerAll[pk]||0)+(isNaN(sc)?0:sc);
      if(isFinal) playerFinal[pk]=(playerFinal[pk]||0)+(isNaN(sc)?0:sc);
      else playerRR[pk]=(playerRR[pk]||0)+(isNaN(sc)?0:sc);
    }
  });
  // results
  const results={};
  schedule.forEach(m=>{
    const mkH=`${m.date}|${m.time}|${m.home}`, mkA=`${m.date}|${m.time}|${m.away}`;
    function sum(mk){ const o=matchPlayer[mk]; if(!o) return 0; return Object.values(o).reduce((s,v)=>s+v,0); }
    const hScore=sum(mkH), aScore=sum(mkA);
    const has = mkH in matchPlayer || mkA in matchPlayer;
    let winner=null;
    if(mkH in matchPlayer && mkA in matchPlayer) winner = hScore>aScore?m.home:(aScore>hScore?m.away:null);
    results[m.seq]={home:m.home,away:m.away,homeScore:hScore,awayScore:aScore,winner,hasData:has,date:m.date,time:m.time,isFinal:m.isFinal};
  });
  // rr standings
  const rrPts={},rrW={},rrL={}; teamOrder.forEach(t=>{rrPts[t]=0;rrW[t]=0;rrL[t]=0;});
  for(let seq=1;seq<=10;seq++){ const r=results[seq]; if(r&&r.winner){ const w=r.winner,l=(r.winner===r.home?r.away:r.home);
    rrPts[w]+=2;rrW[w]+=1;rrPts[l]+=1;rrL[l]+=1; } }
  function headToHead(a,b){
    for(let seq=1; seq<=10; seq++){
      const r = results[seq];
      if(!r || !r.winner) continue;
      if((r.home===a && r.away===b) || (r.home===b && r.away===a)){
        return r.winner===a ? -1 : 1;
      }
    }
    return 0;
  }
  const rrStandings=teamOrder.slice().sort((a,b)=> rrPts[b]-rrPts[a] || headToHead(a,b) || rrW[b]-rrW[a] || a.localeCompare(b))
    .map(t=>({team:t,points:rrPts[t],win:rrW[t],loss:rrL[t],played:rrW[t]+rrL[t]}));
  // final
  function teamsOf(seq){ const m=schedule.find(x=>x.seq===seq); const out=[];
    Object.keys(matchPlayer).forEach(k=>{ const p=k.split("|"); if(p[0]===m.date&&p[1]===m.time) out.push(p[2]); }); return out; }
  let final=null;
  const t12=teamsOf(12), t11=teamsOf(11);
  if(t12.length===2||t11.length===2){
    function decide(ts){ const m=schedule.find(x=>x.seq=== (ts===t12?12:11)); const a=ts[0],b=ts[1];
      const sa=Object.values(matchPlayer[`${m.date}|${m.time}|${a}`]||{}).reduce((s,v)=>s+v,0);
      const sb=Object.values(matchPlayer[`${m.date}|${m.time}|${b}`]||{}).reduce((s,v)=>s+v,0);
      return sa>=sb?[a,b]:[b,a]; }
    let champ=null,runner=null,third=null,fourth=null;
    if(t12.length===2){ const d=decide(t12); champ=d[0]; runner=d[1]; }
    if(t11.length===2){ const d=decide(t11); third=d[0]; fourth=d[1]; }
    final={champion:champ,runner:runner,third:third,fourth:fourth};
  }
  // players
  const nameMap={}; roster.forEach(p=>{ nameMap[`${p.team}|${p.number}`]=p.name; });
  const players=roster.map(p=>{ const k=`${p.team}|${p.number}`;
    return {name:p.name,number:p.number,team:p.team,
      total:playerAll[k]||0, rr:playerRR[k]||0, final:playerFinal[k]||0}; })
    .sort((a,b)=> b.total-a.total || a.team.localeCompare(b.team) || a.number-b.number);
  // matchPlayers arrays
  const matchPlayers={};
  Object.keys(matchPlayer).forEach(mk=>{
    const arr=Object.keys(matchPlayer[mk]).map(no=>({number:+no,name:nameMap[`${mk.split("|")[2]}|${no}`]||("球员#"+no),score:matchPlayer[mk][no]}))
      .sort((a,b)=> b.score-a.score || a.number-b.number);
    matchPlayers[mk]=arr;
  });
  return {results,rrStandings,final,players,matchPlayers,dailySheets,meta:{hasFinal:final!=null,source:"import"}};
}

/* ---------- incremental import helpers ---------- */
function parseWorkbook(wb){
  const teamOrder = BASE.teamOrder;
  const schedule = BASE.schedule;
  const ALIAS={};
  teamOrder.forEach(t=>{ ALIAS[t]=t; if(t.endsWith("战队"))ALIAS[t.slice(0,-2)]=t; if(t.endsWith("队"))ALIAS[t.slice(0,-1)]=t; });
  function normTeam(n){ if(n==null)return null; n=String(n).trim(); if(ALIAS[n])return ALIAS[n];
    for(const t of teamOrder){ if(n.includes(t)||t.includes(n)) return t; } return n; }
  function sheetLabel(name){
    name=String(name).trim();
    if(name.includes("月")&&name.includes("日")) return name;
    for(const sep of [".","/","-"]){ if(name.includes(sep)){ const p=name.split(sep);
      if(p.length===2 && /^\d+$/.test(p[0]) && /^\d+$/.test(p[1])) return `${+p[0]}月${+p[1]}日`; } }
    return name;
  }
  const schedByDate={}; schedule.forEach(m=>{ (schedByDate[m.date]=schedByDate[m.date]||[]).push(m); });
  const matchPlayer={};          // "date|time|team" -> {number:score}
  const dailySheets=[];
  wb.SheetNames.forEach(sname=>{
    const ws=wb.Sheets[sname];
    const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:null,raw:true});
    let hIdx=-1;
    for(let i=0;i<rows.length;i++){ if(rows[i]&&rows[i].some(c=>typeof c==="string"&&c.includes("场次"))){hIdx=i;break;} }
    if(hIdx<0) return;
    const header=rows[hIdx];
    const ciField=header.findIndex(h=>h==="场次");
    const ciTeam=header.findIndex(h=>h==="队名");
    const ciNo=header.findIndex(h=>typeof h==="string"&&h.includes("队内号码"));
    const ciScore=header.findIndex(h=>h==="得分");
    if(ciField<0||ciTeam<0||ciNo<0||ciScore<0) return;
    const dateLabel=sheetLabel(sname); dailySheets.push(dateLabel);
    for(let i=hIdx+1;i<rows.length;i++){
      const r=rows[i]; if(!r||r[ciField]==null) continue;
      const ftime=String(r[ciField]).trim();
      const team=normTeam(r[ciTeam]);
      let no, sc;
      try{ no=parseInt(r[ciNo]); sc=r[ciScore]==null?0:parseInt(r[ciScore]); }catch(e){ continue; }
      if(isNaN(no)) continue;
      const mk=`${dateLabel}|${ftime}|${team}`;
      const mp=matchPlayer[mk]||(matchPlayer[mk]={});
      mp[no]=(mp[no]||0)+ (isNaN(sc)?0:sc);
    }
  });
  return {matchPlayer, dailySheets};
}

function rebuildFromMatchPlayer(matchPlayer, dailySheets){
  const teamOrder = BASE.teamOrder;
  const schedule = BASE.schedule;
  const roster = (BASE.players||[]).map(p=>({team:p.team,number:p.number,name:p.name}));
  // results
  const results={};
  schedule.forEach(m=>{
    const mkH=`${m.date}|${m.time}|${m.home}`, mkA=`${m.date}|${m.time}|${m.away}`;
    function sum(mk){ const o=matchPlayer[mk]; if(!o) return 0; return Object.values(o).reduce((s,v)=>s+v,0); }
    const hScore=sum(mkH), aScore=sum(mkA);
    const has = mkH in matchPlayer || mkA in matchPlayer;
    let winner=null;
    if(mkH in matchPlayer && mkA in matchPlayer) winner = hScore>aScore?m.home:(aScore>hScore?m.away:null);
    results[m.seq]={home:m.home,away:m.away,homeScore:hScore,awayScore:aScore,winner,hasData:has,date:m.date,time:m.time,isFinal:m.isFinal};
  });
  // rr standings
  const rrPts={},rrW={},rrL={}; teamOrder.forEach(t=>{rrPts[t]=0;rrW[t]=0;rrL[t]=0;});
  for(let seq=1;seq<=10;seq++){ const r=results[seq]; if(r&&r.winner){ const w=r.winner,l=(r.winner===r.home?r.away:r.home);
    rrPts[w]+=2;rrW[w]+=1;rrPts[l]+=1;rrL[l]+=1; } }
  function headToHead(a,b){
    for(let seq=1; seq<=10; seq++){
      const r = results[seq];
      if(!r || !r.winner) continue;
      if((r.home===a && r.away===b) || (r.home===b && r.away===a)){
        return r.winner===a ? -1 : 1;
      }
    }
    return 0;
  }
  const rrStandings=teamOrder.slice().sort((a,b)=> rrPts[b]-rrPts[a] || headToHead(a,b) || rrW[b]-rrW[a] || a.localeCompare(b))
    .map(t=>({team:t,points:rrPts[t],win:rrW[t],loss:rrL[t],played:rrW[t]+rrL[t]}));
  // final
  function teamsOf(seq){ const m=schedule.find(x=>x.seq===seq); const out=[];
    Object.keys(matchPlayer).forEach(k=>{ const p=k.split("|"); if(p[0]===m.date&&p[1]===m.time) out.push(p[2]); }); return out; }
  let final=null;
  const t12=teamsOf(12), t11=teamsOf(11);
  if(t12.length===2||t11.length===2){
    function decide(ts){ const m=schedule.find(x=>x.seq=== (ts===t12?12:11)); const a=ts[0],b=ts[1];
      const sa=Object.values(matchPlayer[`${m.date}|${m.time}|${a}`]||{}).reduce((s,v)=>s+v,0);
      const sb=Object.values(matchPlayer[`${m.date}|${m.time}|${b}`]||{}).reduce((s,v)=>s+v,0);
      return sa>=sb?[a,b]:[b,a]; }
    let champ=null,runner=null,third=null,fourth=null;
    if(t12.length===2){ const d=decide(t12); champ=d[0]; runner=d[1]; }
    if(t11.length===2){ const d=decide(t11); third=d[0]; fourth=d[1]; }
    final={champion:champ,runner:runner,third:third,fourth:fourth};
  }
  // players (recomputed from matchPlayer)
  const playerAll={},playerRR={},playerFinal={};
  Object.keys(matchPlayer).forEach(mk=>{
    const parts=mk.split("|"); const date=parts[0],time=parts[1],team=parts[2];
    const m=schedule.find(x=>x.date===date&&x.time===time); if(!m) return;
    const isFinal=m.isFinal;
    const obj=matchPlayer[mk];
    Object.keys(obj).forEach(no=>{ const pk=`${team}|${no}`; const sc=obj[no];
      playerAll[pk]=(playerAll[pk]||0)+sc;
      if(isFinal) playerFinal[pk]=(playerFinal[pk]||0)+sc; else playerRR[pk]=(playerRR[pk]||0)+sc; });
  });
  const nameMap={}; roster.forEach(p=>{ nameMap[`${p.team}|${p.number}`]=p.name; });
  const players=roster.map(p=>{ const k=`${p.team}|${p.number}`;
    return {name:p.name,number:p.number,team:p.team,
      total:playerAll[k]||0, rr:playerRR[k]||0, final:playerFinal[k]||0}; })
    .sort((a,b)=> b.total-a.total || a.team.localeCompare(b.team) || a.number-b.number);
  // matchPlayers arrays
  const matchPlayers={};
  Object.keys(matchPlayer).forEach(mk=>{
    const arr=Object.keys(matchPlayer[mk]).map(no=>({number:+no,name:nameMap[`${mk.split("|")[2]}|${no}`]||("球员#"+no),score:matchPlayer[mk][no]}))
      .sort((a,b)=> b.score-a.score || a.number-b.number);
    matchPlayers[mk]=arr;
  });
  return {results,rrStandings,final,players,matchPlayers,dailySheets,meta:{hasFinal:final!=null,source:"import"}};
}

function matchPlayersArrToObj(mpArr){
  const obj={};
  Object.keys(mpArr||{}).forEach(mk=>{
    const o={};
    (mpArr[mk]||[]).forEach(p=>{ if(p && p.number!=null) o[p.number]=p.score||0; });
    obj[mk]=o;
  });
  return obj;
}

/* ---------- 主题切换（暗色 / 浅色 / 自动） ---------- */
const THEME_KEY = "fyns_theme";
/* 跟随系统：左半太阳 + 右半月亮（各一半） */
const AUTO_ICON = '<img src="auto-theme-icon.png" alt="" width="28" height="28" aria-hidden="true" style="display:block;width:28px;height:28px;object-fit:contain;pointer-events:none">';
function sysPref(){ return (window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light"; }
function updateThemeBtn(){
  const btn = document.getElementById("themeBtn");
  if(!btn) return;
  if(getStoredTheme()==="auto"){
    btn.innerHTML = AUTO_ICON;
    btn.setAttribute("aria-label","当前跟随系统，点击切换");
  }else{
    const t = document.documentElement.getAttribute("data-theme");
    btn.textContent = (t==="light") ? "☀️" : "🌙";
    btn.setAttribute("aria-label", t==="light" ? "当前浅色，点击切换" : "当前暗色，点击切换");
  }
}
function applyTheme(t){
  if(t!=="dark" && t!=="light") t = sysPref();
  document.documentElement.setAttribute("data-theme", t);
  updateThemeBtn();
}
function getStoredTheme(){ try{ return localStorage.getItem(THEME_KEY) || "dark"; }catch(e){ return "dark"; } }
function setTheme(t){
  try{ localStorage.setItem(THEME_KEY, t); }catch(e){}
  applyTheme(t);
}
function toggleTheme(){
  const order = {dark:"light", light:"auto", auto:"dark"};
  const stored = getStoredTheme();
  const next = order[stored] || "light";
  setTheme(next);
  toast(next==="auto" ? "主题：跟随系统" : (next==="light" ? "主题：浅色" : "主题：暗色"));
}
if(document.getElementById("themeBtn")){
  document.getElementById("themeBtn").addEventListener("click", toggleTheme);
}
if(window.matchMedia){
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", ()=>{
    if(getStoredTheme()==="auto") applyTheme("auto");
  });
}

/* ---------- init ---------- */
applyCheerMenuToken(location.search);   // 复用 ?token=7 时展示"啦啦队"菜单
setPage("schedule");
applyTheme(getStoredTheme());            // 同步按钮图标（首屏已由 head 内联脚本定好主题）
/* 啦啦队：启动时拉取云端打分（若配置了 Supabase），并保持 30s 自动刷新 */
refreshCheerFromCloud().then(ok=>{ if(ok && state.page==="cheer") renderCheer(); });
setInterval(()=>{
  if(state.page==="cheer"){
    refreshCheerFromCloud().then(()=>renderCheer());  // 跨 18:00 自动放行 + 云端数据同步
  }
}, 30000);
/* 比赛数据集：启动时拉取云端较新数据（部署网址其他设备导入的也能看到），并 60s 轮询自动更新 */
applyCloudDatasetIfNewer().then(changed=>{ if(changed) setPage(state.page); });
/* 数据快照：启动时合并云端快照（其他设备保存的快照本机也能看到），并 60s 轮询自动更新 */
mergeCloudSnaps().then(changed=>{ if(changed && document.getElementById("snapModal") && document.getElementById("snapModal").classList.contains("show")) renderSnapList(); });
setInterval(()=>{
  if(["schedule","rankings","players","daily"].includes(state.page)){
    applyCloudDatasetIfNewer().then(changed=>{ if(changed) setPage(state.page); });
    mergeCloudSnaps().then(changed=>{ if(changed && document.getElementById("snapModal") && document.getElementById("snapModal").classList.contains("show")) renderSnapList(); });
  }
}, 60000);
